# Pushing a version tag (v0.1.0) builds the panel and publishes it as a
# GitHub release, described by docs/release-notes/<version>.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Zipped, as GitHub turns the space in an attached file's name
          # into a dot, and After Effects shows the file's name in its
          # Window menu.
          (cd dist && zip -q "Marker-Manager-$version.zip" "Marker Manager.jsx")
          gh release create "$GITHUB_REF_NAME" "dist/Marker-Manager-$version.zip" \
            --title "Marker Manager $version" \
            --notes-file "docs/release-notes/$version.md"
